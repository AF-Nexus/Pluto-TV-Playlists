name: Auto Pluto Update

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm install

      - name: Run scraper
        run: node index.js

      - name: Commit files
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"
          git add .
          git commit -m "Auto update playlist" || echo "No changes"
          git push --force

      - name: Sync to Channelzz
        if: ${{ secrets.RENDER_URL != '' }}
        run: |
          curl -s -X POST \
            -H "x-sync-secret: ${{ secrets.SYNC_SECRET }}" \
            "${{ secrets.RENDER_URL }}/api/webhooks/pluto?githubUser=${{ github.repository_owner }}" \
            || true
